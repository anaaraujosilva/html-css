<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Georgia, 'Times New Roman', Times, serif;
        }
        table {
            width: 500px;
            border-collapse: collapse;
        }
        td, th {
            border: 1px solid rgb(0, 0, 0);
            padding: 6px;
        }
        thead, tfoot{
            background-color: rgb(51, 97, 32);
            color: white;
        }
    </style>
</head>
<body>
    <h1>Tabelas Grandes</h1>
    <table>
        <thead>
            <tr>
                <th>Estado</th>
                <th>População</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>São Paulo</td>
                <td>45 919 049</td>
            </tr>
            <tr>
                <td>Minas Gerais</td>
                <td>21 168 791</td>
            </tr>
            <tr>
                <td>Rio de Janeiro</td>
                <td>17 264 943</td>
            </tr>
            <tr>
                <td>Bahia</td>
                <td>14 873 064</td>
            </tr>
            <tr>
                <td>Rio Grande do Norte</td>
                <td>3 506 853</td>
            </tr>
            <tr>
                <td>Paraíba</td>
                <td>4 018 127</td>
            </tr>
            <tr>
                <td>Amazonas</td>
                <td>4 144 567</td>
            </tr>
        </tbody>
        <tfoot>
            <th>Total de Habitantes</th>
            <td>210.147.125</td>
        </tfoot>
    </table>
</body>
</html>
