<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulario</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <fieldset>
            <legend>Genero</legend>
            <input type="radio" name="genero" id="igmas" value="M"><label for="igmas">Masculino</label>
            <input type="radio" name="genero" id="igfem" checked value="F"> <label for="igfem">Feminino</label>
        </fieldset>
        <fieldset>
            <legend>Esportes Favoritos</legend>
            <input type="checkbox" name="esfut" id="iesfut" checked> <label for="iesfut">Futebol </label><br>
            <input type="checkbox" name="esbas" id="iesbas"> <label for="iesbas">Basquete </label><br>
            <input type="checkbox" name="esnat" id="iesnat"> <label for="iesnat">Natação </label><br>
            <input type="checkbox" name="esten" id="iesten"> <label for="iesten">Tenis</label>
        </fieldset>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
